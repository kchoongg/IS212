name: Telegram PR notifications

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          HEADLINE="PR ${ACTION} by ${AUTHOR}"
          if [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
            HEADLINE="PR by ${AUTHOR} merged by ${MERGED_BY}"
          fi
          # Only send a topic id when one is set; an empty one is rejected in some chats.
          THREAD_ARG=()
          if [ -n "$THREAD_ID" ]; then THREAD_ARG=(--data-urlencode "message_thread_id=${THREAD_ID}"); fi
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            "${THREAD_ARG[@]}" \
            --data-urlencode "text=${HEADLINE}: ${TITLE}
          ${URL}"
